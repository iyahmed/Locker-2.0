[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obliv"
version = "0.0.2"
description = "ORAM with variable-size blocks and HIRB data structure"
authors = [
    { name = "Daniel S. Roche", email = "roche@usna.edu" }
]
license = { text = "Unlicense" }
readme = "README.rst"
requires-python = ">=3.6,<3.14"
dependencies = [
    "pycryptodome>=3.18.0",
    "paramiko>=3.0.0",
    "poetry>=2.1.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "coverage>=6.0.0",
    "mypy>=1.0.0",
    "flake8>=5.0.0",
    "tox>=4.25.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.poetry.dependencies]
python = ">=3.6,<3.14"
